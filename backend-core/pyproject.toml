[project]
name = "backend-core"
version = "0.1.0"
description = "Control plane API (auth, config, ingestion stub)"
requires-python = ">=3.12"
dependencies = [
    "shared-core",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
]

[project.scripts]
backend-core = "backend_core.main:run"
backend-core-migrate = "backend_core.migrate:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
shared-core = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

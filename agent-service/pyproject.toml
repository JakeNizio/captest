[project]
name = "agent-service"
version = "0.1.0"
description = "LangGraph chat runtime (Phase 1 scaffold)"
requires-python = ">=3.12"
dependencies = [
    "shared-core",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]

[project.scripts]
agent-service = "agent_service.main:run"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
shared-core = { workspace = true }

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
